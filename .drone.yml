# Deux pipelines. Le premier valide chaque poussée, sur toutes les branches.
# Le second ne part que sur main, et seulement si le premier est passé.

kind: pipeline
type: docker
name: verification

trigger:
  event:
    - push
    - pull_request

# Les deux étapes tournent dans des conteneurs séparés : sans ce volume, la seconde
# repartirait d'un cache vide et ne retrouverait pas les paquets restaurés par la première.
volumes:
  - name: nuget
    temp: {}

steps:
  - name: "🛠 build"
    image: mcr.microsoft.com/dotnet/sdk:9.0
    environment:
      NUGET_PACKAGES: /nuget
    volumes:
      - name: nuget
        path: /nuget
    commands:
      - echo "🛠 [INFO] Build de la solution complète..."
      - dotnet build ./portfolio_siwa.sln -c Release
      - echo "✅ [SUCCESS] Build terminé."

  - name: "🧪 tests-unitaires"
    image: mcr.microsoft.com/dotnet/sdk:9.0
    environment:
      NUGET_PACKAGES: /nuget
    volumes:
      - name: nuget
        path: /nuget
    commands:
      - echo "🧪 [INFO] Lancement des tests..."
      - dotnet test ./portfolio_siwa.sln -c Release --no-build
      - echo "✅ [SUCCESS] Tests passés."

---
kind: pipeline
type: docker
name: deploiement-main

trigger:
  branch:
    - main
  event:
    - push

depends_on:
  - verification

steps:
  - name: "🐳 build-et-push-image"
    image: plugins/docker
    settings:
      registry: registry.davalada.valorium-mc.fr
      repo: registry.davalada.valorium-mc.fr/portfolio-siwa-main
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      dockerfile: Dockerfile
      tags:
        - latest

  - name: "🚀 deploiement-vps-main"
    image: appleboy/drone-ssh
    depends_on:
      - "🐳 build-et-push-image"
    settings:
      host: ecirada.valorium-mc.fr
      username:
        from_secret: SSH_USER
      ssh_key:
        from_secret: SSH_PRIVATE_KEY
      port: 22
      script:
        - echo "🚀 [INFO] Déploiement en cours..."
        - cd deploiements/portfolio-siwa
        - echo "🛑 [INFO] Arrêt de l'ancien service..."
        - docker compose down
        - echo "📥 [INFO] Pull de la nouvelle image..."
        - docker compose pull
        - echo "🚀 [INFO] Relancement du service..."
        - docker compose up -d
        - sleep 5
        - docker ps | grep portfolio-siwa || {
            echo "❌ [ERROR] Le service ne tourne pas !";
            exit 1;
          }
        - echo "✅ [SUCCESS] Déploiement terminé."
